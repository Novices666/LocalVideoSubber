[project]
name = "local-video-subber"
version = "0.1.0"
description = "本地视频字幕工作台：转录 + 翻译 + 渲染，全离线模型"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0",
    "ctranslate2>=4.0",
    "openai>=1.40",
    "pyyaml>=6.0",
    "requests>=2.31",
    "tqdm>=4.66",
    "huggingface-hub>=0.23",
]

[project.optional-dependencies]
# whisper.cpp GGML 后端（可选，CPU 降级路径）
whispercpp = ["pywhispercpp>=1.2"]
# 本地开发与 CI 测试
test = ["pytest>=8.0"]

[project.scripts]
lvs = "lvs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lvs"]

[tool.uv]
# CUDA 版 ctranslate2 依赖的 nvidia 运行库按需安装
package = true

[tool.pytest.ini_options]
markers = [
    "slow: 慢测试（需要真实模型和 ffmpeg，用 -m 'not slow' 跳过）",
]
testpaths = ["tests"]
